<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ZeroOne - Multi-Service Booking Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0f172a';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f5f6f8';
          }

          // Detect Mobile App vs Web Browser
          var params = new URLSearchParams(window.location.search);
          var platform = params.get('platform') || params.get('app');
          if (platform === 'app' || platform === 'true') {
            sessionStorage.setItem('zeroone_is_app', 'true');
          } else if (platform === 'web') {
            sessionStorage.removeItem('zeroone_is_app');
          }

          var isApp = sessionStorage.getItem('zeroone_is_app') === 'true' ||
            window.Capacitor !== undefined ||
            window.cordova !== undefined ||
            window.ReactNativeWebView !== undefined ||
            window.flutter_inappwebview !== undefined ||
            window.Android !== undefined ||
            window.AndroidInterface !== undefined ||
            window.isNativeApp === true ||
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true ||
            /ZeroOneApp|wv|Android.*Version\/[0-9.]+/i.test(navigator.userAgent || '');

          if (isApp) {
            document.documentElement.classList.add('is-app');
          } else {
            document.documentElement.classList.remove('is-app');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark font-sans">
    <div id="root"></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
